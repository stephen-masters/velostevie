<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vélostevie — a bike packing journal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { background: var(--paper); min-height: 100vh; }
    #app { min-height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Cards.jsx"></script>
  <script type="text/babel" src="MapEmbed.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="ReportScreen.jsx"></script>
  <script type="text/babel" src="OtherScreens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [screen, setScreen] = useState('home');
      const go = (s) => { setScreen(s); window.scrollTo(0, 0); };

      const navCurrent = screen === 'report' ? 'home' : screen;

      return (
        <div data-screen-label={`Blog · ${screen}`}>
          <Nav current={navCurrent} go={go} />
          {screen === 'home' && <HomeScreen go={go} />}
          {screen === 'report' && <ReportScreen go={go} />}
          {screen === 'routes' && <RoutesScreen go={go} />}
          {screen === 'map' && <MapScreen go={go} />}
          {screen === 'gallery' && <GalleryScreen go={go} />}
          {screen === 'about' && <AboutScreen />}
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
