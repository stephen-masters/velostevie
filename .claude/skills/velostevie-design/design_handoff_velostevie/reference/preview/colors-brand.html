<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 72px; border-radius: var(--radius); border: 1px solid rgba(31,27,23,0.06); }
  .name { font-family: var(--font-sans); font-size: 12px; font-weight: 500; color: var(--fg); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#2F4A3A"></div><div class="name">Forest</div><div class="hex">#2F4A3A</div></div>
    <div class="swatch"><div class="chip" style="background:#24392D"></div><div class="name">Forest deep</div><div class="hex">#24392D</div></div>
    <div class="swatch"><div class="chip" style="background:#6B8A6E"></div><div class="name">Moss</div><div class="hex">#6B8A6E</div></div>
    <div class="swatch"><div class="chip" style="background:#B85C3C"></div><div class="name">Clay (accent)</div><div class="hex">#B85C3C</div></div>
  </div>
</body></html>
