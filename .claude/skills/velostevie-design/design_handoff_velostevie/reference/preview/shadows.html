<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 36px; }
  .cell { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .box { width: 140px; height: 84px; background: var(--paper); border-radius: var(--radius); }
  .sm { box-shadow: 0 1px 2px rgba(31,27,23,0.06); }
  .md { box-shadow: 0 6px 20px rgba(31,27,23,0.10); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .title { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
</style></head>
<body>
  <div class="row">
    <div class="cell"><div class="box sm"></div><div class="title">shadow-sm</div><div class="lbl">card resting</div></div>
    <div class="cell"><div class="box md"></div><div class="title">shadow-md</div><div class="lbl">map popover hover</div></div>
    <div class="cell"><div class="box" style="border:1px solid var(--border)"></div><div class="title">hairline</div><div class="lbl">1px · stone-soft</div></div>
  </div>
</body></html>
