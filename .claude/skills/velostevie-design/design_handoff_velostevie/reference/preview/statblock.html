<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px 24px; background: var(--paper-deep); }
  .block { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--paper); }
  .cell { padding: 18px 20px; border-right: 1px solid var(--border); }
  .cell:last-child { border-right: 0; }
  .k { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .v { font-family: var(--font-serif); font-weight: 600; font-size: 28px; color: var(--ink); line-height: 1; letter-spacing: -0.01em; }
  .u { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); margin-left: 4px; font-weight: 400; }
</style></head>
<body>
  <div class="block">
    <div class="cell"><div class="k">Distance</div><div class="v">237<span class="u">km</span></div></div>
    <div class="cell"><div class="k">Elevation</div><div class="v">3,420<span class="u">m</span></div></div>
    <div class="cell"><div class="k">Days</div><div class="v">4</div></div>
    <div class="cell"><div class="k">Surface</div><div class="v" style="font-size:18px;">mixed</div></div>
  </div>
</body></html>
