<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; }
  .wrap { display: flex; align-items: center; gap: 40px; padding: 28px 32px; min-height: 150px; }
  .logo-big {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 600;
    font-size: 56px;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
    text-decoration: underline;
    text-decoration-color: var(--clay);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.15em;
  }
  .mini { display: flex; flex-direction: column; gap: 12px; }
  .mini img { width: 56px; height: 56px; }
  .mini-lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--fg-muted); text-transform: uppercase; }
</style></head>
<body>
  <div class="wrap">
    <div class="logo-big">vélostevie</div>
    <div style="width:1px;height:80px;background:var(--border)"></div>
    <div class="mini">
      <img src="../assets/favicon.svg" alt="favicon">
      <div class="mini-lbl">Favicon</div>
    </div>
  </div>
</body></html>
