<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px 28px; }
  .prose-demo { max-width: 640px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .t { font-family: var(--font-serif); font-weight: 700; font-size: 36px; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 10px 0; }
  .l { font-family: var(--font-serif); font-style: italic; font-size: 17px; line-height: 1.5; color: var(--fg-2); margin: 0 0 10px 0; }
  .s { font-family: var(--font-mono); font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="prose-demo">
    <div class="eyebrow">Route report · Brittany</div>
    <h1 class="t">Finistère in four days</h1>
    <p class="l">I rode into Roscoff on the ferry at 6am, ate a croissant that changed my life, and pointed the bike south.</p>
    <div class="s">237 km · 3,420 m · Apr 2026</div>
  </div>
</body></html>
