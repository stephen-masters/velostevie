<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 24px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.08em; text-transform: uppercase; width: 130px; }
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="lbl">Lede 20 serif italic</span><span style="font-family:var(--font-serif);font-style:italic;font-size:20px;color:var(--fg-2);">I rode into Roscoff at 6am.</span></div>
    <div class="line"><span class="lbl">Body 18</span><span style="font-size:18px;line-height:1.5;">The tent leaked. It always leaks. I bring it anyway.</span></div>
    <div class="line"><span class="lbl">UI 16</span><span style="font-size:16px;font-weight:500;">Download GPX</span></div>
    <div class="line"><span class="lbl">Small 14</span><span style="font-size:14px;color:var(--fg-muted);">Built on a kitchen table in Rennes.</span></div>
    <div class="line"><span class="lbl">Caption 12</span><span style="font-size:12px;color:var(--fg-muted);">Photo: Morlaix viaduct, morning.</span></div>
  </div>
</body></html>
