<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 24px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .mono-sample { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="lbl" style="margin-bottom:6px;">Stat line</div>
      <div class="mono-sample" style="font-size:15px;color:var(--fg-2);">237 km · 3,420 m · 4 days · mixed surface</div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px;">Eyebrow</div>
      <div class="mono-sample" style="font-size:12px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.1em;">Route report · Brittany</div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px;">Coordinates</div>
      <div class="mono-sample" style="font-size:13px;color:var(--fg-2);">48.7276° N, 3.9816° W</div>
    </div>
  </div>
</body></html>
