<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 72px; border-radius: var(--radius); border: 1px solid rgba(31,27,23,0.06); }
  .name { font-family: var(--font-sans); font-size: 12px; font-weight: 500; color: var(--fg); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#FBFAF6"></div><div class="name">Paper</div><div class="hex">#FBFAF6</div></div>
    <div class="swatch"><div class="chip" style="background:#F3EFE4"></div><div class="name">Paper deep</div><div class="hex">#F3EFE4</div></div>
    <div class="swatch"><div class="chip" style="background:#1F1B17"></div><div class="name">Ink</div><div class="hex">#1F1B17</div></div>
    <div class="swatch"><div class="chip" style="background:#3A342D"></div><div class="name">Ink soft</div><div class="hex">#3A342D</div></div>
  </div>
</body></html>
