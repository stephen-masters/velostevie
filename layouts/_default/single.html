{{ define "main" }}
<article>
  {{ with .Params.image }}
  <div class="article-hero-image container">
    <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
  </div>
  {{ end }}

  <header class="article-header container">
    <div class="eyebrow">Route report · {{ .Date.Format "January 2006" }}</div>
    <h1 class="article-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="article-lede">{{ . }}</p>{{ end }}
  </header>

  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
