{{- $src     := .Get "src" -}}
{{- $caption := .Get "caption" -}}
{{- $img := resources.Get (strings.TrimLeft "/" $src) -}}
{{- if $img -}}
{{- $processed := $img.Resize "1200x webp" -}}
<figure class="article-fig">
  <img src="{{ $processed.RelPermalink }}" alt="{{ $caption }}" loading="lazy">
  {{- if $caption -}}<figcaption>{{ $caption }}</figcaption>{{- end -}}
</figure>
{{- end -}}
