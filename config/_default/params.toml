[main]
  description = "A bikepacking journal by Stephen Masters — long-distance cycling routes through France and beyond, with route reports, photography, and GPX maps."

[author]
  name = "Stephen Masters"
  github = "https://github.com/stephen-masters"
  mastodon = "https://hachyderm.io/@Stevie"
  linkedin = "stephenmasters"
  scattercode = "https://scattercode.dev"

[analytics]
  # First-party path served by the Cloudflare Pages Function at
  # functions/js/script.js.js, which proxies the real Plausible script.
  # The event beacon is likewise proxied via functions/api/event.js and
  # wired up with plausible.init({endpoint:"/api/event"}) in head.html.
  # Proxying keeps both requests same-origin so tracker blocklists that
  # match the plausible.io domain do not block them. The upstream hashed
  # script URL lives in the Pages Function, not here.
  plausible_src = "/js/script.js"

[giscus]
  repo       = "stephen-masters/velostevie"
  repoId     = "R_kgDORzLGcA"
  category   = "General"
  categoryId = "DIC_kwDORzLGcM4C71Dv"
  mapping    = "pathname"
  theme      = "light"